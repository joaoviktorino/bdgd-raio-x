# Gera o site (site/) e publica no GitHub Pages a cada mudança no main.
name: Publicar site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez; se chegar outra, a anterior é concluída antes.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Instalar dependências
        working-directory: site
        run: npm ci

      - name: Gerar o site
        working-directory: site
        run: npm run build

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - id: publicacao
        uses: actions/deploy-pages@v4
